async function updCheck(){if(!updOn())return{err:"更新の準備ができていません"};
 try{const t=await window.api.fetchText("https://github.com/"+UPD_REPO+"/releases/latest/download/latest.json"),m=JSON.parse(t);
  if(!m.version||!m.url||!m.sha256)throw new Error("案内の形が違います");
  UPD=verCmp(m.version,APPV)>0?m:null;return{u:UPD}}catch(e){return{err:String((e&&e.message)||e)}}}
async function updRun(msg){const u=UPD;if(!u||updBusy)return;updBusy=true;
 try{msg("ダウンロード中…");const b=await window.api.fetchBytes(u.url);msg("確かめています…");
  if(sha256hex(b)!==String(u.sha256).toLowerCase())throw new Error("ファイルが壊れています");
  msg("入れ替えています…");await window.api.applyUpdate(b);msg("開きなおします…");save();await window.api.restartApp()}

/* ===== Googleカレンダー(公開iCalの読み取り) ===== */
function parseICS(txt){
 const from=new Date();from.setDate(from.getDate()-45);from.setHours(0,0,0,0);const to=new Date();to.setDate(to.getDate()+400);
 const L=txt.replace(/\r?\n[ \t]/g,"").split(/\r?\n/),V=[];let c=null;
 for(const ln of L){if(ln==="BEGIN:VEVENT"){c={};continue}if(ln==="END:VEVENT"){if(c)V.push(c);c=null;continue}if(!c)continue;const i=ln.indexOf(":");if(i<0)continue;const nm=ln.slice(0,i).split(";")[0].toUpperCase(),v=ln.slice(i+1);if(nm==="EXDATE")(c.EX=c.EX||[]).push(...v.split(","));else c[nm]=v}
 const pd=v=>{const m=(v||"").match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?/);if(!m)return null;return{ad:!m[4],d:m[7]?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))):new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0))}};
 const key=d=>ymd(d)+"T"+pad(d.getHours())+pad(d.getMinutes());
 const unesc=t=>(t||"").replace(/\\[nN]/g," ").replace(/\\([,;\\])/g,"$1");
 const out={};let cnt=0;
 const add=(k,t,s)=>{if(cnt>5000)return;cnt++;(out[k]=out[k]||[]).push({t,s})};
 const put=(s0,ad,dur,title)=>{if(ad){const d0=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()),n=Math.max(Math.round(dur/864e5),1);for(let i=0;i<n;i++){const x=new Date(d0);x.setDate(x.getDate()+i);if(x<from||x>to)continue;add(ymd(x),"",title)}}else{if(s0<from||s0>to)return;add(ymd(s0),pad(s0.getHours())+":"+pad(s0.getMinutes()),title)}};
 const skip=new Set();
 V.forEach(v=>{if(v["RECURRENCE-ID"]){const r=pd(v["RECURRENCE-ID"]);if(r)skip.add(v.UID+"|"+ymd(r.d))}});
 V.forEach(v=>{
  if((v.STATUS||"").toUpperCase()==="CANCELLED")return;
  const st=pd(v.DTSTART);if(!st)return;const en=pd(v.DTEND);let dur=en?en.d-st.d:(st.ad?864e5:0);if(dur<0)dur=0;const title=unesc(v.SUMMARY)||"(無題)";
  if(!v.RRULE){put(st.d,st.ad,dur,title);return}
  const Rr={};v.RRULE.split(";").forEach(p=>{const q=p.split("=");Rr[q[0]]=q[1]});
  const iv=+Rr.INTERVAL||1,cap=Rr.COUNT?+Rr.COUNT:Infinity,until=Rr.UNTIL?(pd(Rr.UNTIL)||{}).d:null,ex=new Set((v.EX||[]).map(x=>{const q=pd(x);return q?(q.ad?ymd(q.d):key(q.d)):""}));
  const WK=["SU","MO","TU","WE","TH","FR","SA"],by=Rr.BYDAY?Rr.BYDAY.split(",").map(x=>WK.indexOf(x.slice(-2))).filter(x=>x>=0):null;
  let n=0;const emit=d=>{if(until&&d>until)return false;if(d>to)return false;if(n>=cap)return false;n++;if(!ex.has(st.ad?ymd(d):key(d))&&!skip.has(v.UID+"|"+ymd(d)))put(d,st.ad,dur,title);return true};
  const base=st.d;
  if(Rr.FREQ==="DAILY"){for(let k=0;k<4000;k++){const d=new Date(base);d.setDate(d.getDate()+k*iv);if(!emit(d))break}}
  else if(Rr.FREQ==="WEEKLY"){const days=(by&&by.length?by:[base.getDay()]).slice().sort((a,b)=>a-b),w0=new Date(base);w0.setDate(w0.getDate()-w0.getDay());
   outer:for(let k=0;k<1500;k++){for(const wd of days){const d=new Date(w0);d.setDate(d.getDate()+k*7*iv+wd);d.setHours(base.getHours(),base.getMinutes(),base.getSeconds());if(d<base)continue;if(!emit(d))break outer}}}
  else if(Rr.FREQ==="MONTHLY"){for(let k=0;k<400;k++){const d=new Date(base);d.setDate(1);d.setMonth(base.getMonth()+k*iv);const dd=base.getDate();if(new Date(d.getFullYear(),d.getMonth()+1,0).getDate()<dd)continue;d.setDate(dd);if(!emit(d))break}}
  else if(Rr.FREQ==="YEARLY"){for(let k=0;k<100;k++){const d=new Date(base);d.setFullYear(base.getFullYear()+k*iv);if(!emit(d))break}}
  else put(base,st.ad,dur,title);
 });
 Object.values(out).forEach(a=>a.sort((x,y)=>x.t.localeCompare(y.t)));
 return out}
function gEvs(d){const out=[];S.gcal.cals.forEach((c,i)=>{if(!c||!c.on||!c.ev)return;const L=c.ev[d];if(!L)return;
 L.forEach((e,j)=>out.push({id:"g"+i+"_"+j,date:d,time:e.t,title:(c.nm!==false&&c.name?"["+c.name+"] ":"")+e.s,g:1,ico:c.ico||"",col:c.col||GCOL[i%3]}))});return out}
const byTime=(a,b)=>(a.time||"").localeCompare(b.time||"");
const evsOn=d=>S.events.filter(e=>e.date===d).concat(gEvs(d)).sort(byTime);
let gBusy=false;
async function gSync(manual){

 if(!cs.length){if(manual)notice("Googleカレンダーが未設定です。設定で登録してください。");return}

 save();rdSoft();say(T.mode==="focus"?"f":"b")}
